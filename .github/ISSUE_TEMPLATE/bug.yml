name: Bug
description: Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened / what you expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
  - type: input
    id: env
    attributes: { label: Environment (client, version, env) }
