version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          ['eslint*', '@eslint/*', 'typescript*', 'prettier', 'turbo', 'vitest', '@vitest/*']
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
