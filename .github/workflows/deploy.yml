name: Deploy

# main → staging, tags vX.Y.Z → production (trunk-based releases, HLD §5).
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
    env:
      TARGET: ${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the '$TARGET' environment secrets (see docs/runbooks/deploy.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: pnpm/action-setup@v6
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.creds.outputs.ready == 'true'
        run: pnpm test

      - name: Build web app
        if: steps.creds.outputs.ready == 'true'
        run: pnpm --filter "./apps/web" --if-present build

      - name: Apply D1 migrations
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/server
        run: pnpm exec wrangler d1 migrations apply DB --remote --env "$TARGET"

      - name: Deploy Worker
        if: steps.creds.outputs.ready == 'true'
        working-directory: apps/server
        run: pnpm exec wrangler deploy --env "$TARGET"

      - name: Smoke test
        if: steps.creds.outputs.ready == 'true' && vars.APP_URL != ''
        run: curl --fail --silent --show-error "${{ vars.APP_URL }}/health"
